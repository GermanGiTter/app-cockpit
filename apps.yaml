  - id: einkaufsliste
    name: Einkaufsliste
    status: active
    description: Gemeinsame Einkaufsliste (Next.js). Repo-Ordner heißt retrograde-filament.
    stack: [node, next, react, typescript]
    tags: [web]
    local_path: C:\Users\rare\.gemini\antigravity\playground\retrograde-filament
    repo_folder: retrograde-filament
    targets: [web]
    workflow:
      dev_on: windows
      release_on: vercel
      summary: "Windows = lokal testen. Internet-Release = nur Vercel (git push). Kein Mac, kein App Store."
      steps:
        - title: Am Windows-PC testen
          detail: npm run dev — im Browser prüfen. Ordner retrograde-filament.
        - title: Live stellen (Vercel)
          detail: Änderungen committen, git push. Vercel baut automatisch. Env-Variablen nur im Vercel-Dashboard, nicht nur lokal.
        - title: Nach dem Deploy
          detail: PUSH-CHECKLISTE.md im Repo durchgehen (DB, VAPID, Tenant, …).
        - title: Auf dem Handy nutzen
          detail: Vercel-URL im Browser öffnen (PWA). Kein Kopieren auf den Mac, kein Xcode.
    prerequisites:
      - Node.js (LTS), npm
      - Vercel-Projekt verbunden (Git)
      - Env-Vars in Vercel (siehe PUSH-CHECKLISTE.md im Repo)
    commands:
      install: |
        cd retrograde-filament
        npm install
      update: |
        cd retrograde-filament
        git pull
        npm install
      dev: |
        cd retrograde-filament
        npm run dev
      build: |
        cd retrograde-filament
        npm run build
      test: |
        cd retrograde-filament
        npm test
      deploy: |
        cd retrograde-filament
        git add -A
        git commit -m "deine Nachricht"
        git push
        # Vercel baut Production; danach PUSH-CHECKLISTE.md im Repo prüfen
    notes:
      - App-Name in der UI „Einkaufsliste“; Projektordner retrograde-filament.
      - Kein iPhone-Transfer — Nutzung im Browser (PWA), Hosting nur Vercel.
